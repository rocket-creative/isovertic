<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img"><rect width="1200" height="540" fill="#F5F4F0"/><text x="60.0" y="80.0" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#14181B" text-anchor="start">When life scientists research a vendor, where do they</text><text x="60.0" y="122.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#14181B" text-anchor="start">go?</text><circle cx="300" cy="385.0" r="160" fill="#E0DED8"/><path d="M300,385.0 L300,225.0 A160,160 0 1,1 176.7,487.0 Z" fill="#0F2C3F"/><circle cx="300" cy="385.0" r="92.8" fill="#F5F4F0"/><text x="300.0" y="407.0" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#0F2C3F" text-anchor="middle">64%</text><text x="560.0" y="355.0" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#14181B" text-anchor="start">64% go to vendor</text><text x="560.0" y="405.0" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#14181B" text-anchor="start">websites.</text><text x="560.0" y="425.0" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5E6670" text-anchor="start">They look for validation data,</text><text x="560.0" y="457.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5E6670" text-anchor="start">citations, and the exact application.</text><text x="60.0" y="508.0" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5E6670" text-anchor="start">Source: Biocompare, Inside the Lab</text></svg>