<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"><rect width="1200" height="400" fill="#F5F4F0"/><text x="60.0" y="80.0" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#14181B" text-anchor="start">Who does which part of a website now</text><rect x="60.0" y="152.5" width="525.0" height="187.5" rx="4" fill="#FFFFFF" stroke="#E0DED8" stroke-width="2"/><text x="88.0" y="198.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#0F2C3F" text-anchor="start">AI does the first pass</text><text x="88.0" y="246.2" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E6670" text-anchor="start">Design</text><text x="88.0" y="283.8" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E6670" text-anchor="start">First drafts</text><text x="88.0" y="321.2" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E6670" text-anchor="start">Code</text><rect x="615.0" y="152.5" width="525.0" height="187.5" rx="4" fill="#FFFFFF" stroke="#E0DED8" stroke-width="2"/><text x="643.0" y="198.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#0F2C3F" text-anchor="start">People decide and check</text><text x="643.0" y="246.2" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E6670" text-anchor="start">What the site should say</text><text x="643.0" y="283.8" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E6670" text-anchor="start">That every claim is true</text><text x="643.0" y="321.2" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E6670" text-anchor="start">That the site is safe to put online</text></svg>