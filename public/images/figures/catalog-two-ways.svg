<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img"><rect width="1200" height="640" fill="#F5F4F0"/><text x="60.0" y="80.0" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#14181B" text-anchor="start">The same model catalog, shown to Google two ways</text><rect x="60.0" y="152.5" width="500.0" height="440.0" rx="4" fill="#FFFFFF" stroke="#E0DED8" stroke-width="2"/><text x="90.0" y="202.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#14181B" text-anchor="start">A search box and a PDF</text><rect x="90.0" y="242.5" width="440.0" height="60.0" rx="4" fill="#F5F4F0" stroke="#B9B6AE" stroke-width="2"/><text x="110.0" y="280.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E6670" text-anchor="start">Search models...</text><rect x="90.0" y="332.5" width="150.0" height="190.0" rx="4" fill="#F5F4F0" stroke="#B9B6AE" stroke-width="2"/><text x="165.0" y="437.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#5E6670" text-anchor="middle">PDF</text><text x="270.0" y="372.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14181B" text-anchor="start">Google can read one</text><text x="270.0" y="402.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14181B" text-anchor="start">page.</text><text x="270.0" y="442.5" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E6670" text-anchor="start">The models inside</text><text x="270.0" y="470.0" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E6670" text-anchor="start">stay out of search.</text><line